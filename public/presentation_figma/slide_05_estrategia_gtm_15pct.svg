          <text x="16" y="21" font-family="Plus Jakarta Sans, Outfit, Inter, sans-serif" font-size="14" font-weight="900" fill="#E27D7D" text-anchor="middle">2</text>
          <text x="45" y="18" font-family="Outfit, Plus Jakarta Sans, Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Micro-Tarifas Amigables</text>
          <text x="45" y="42" font-family="Plus Jakarta Sans, Outfit, Inter, sans-serif" font-size="14" fill="#D4C5D0">$100 a $500 COP por entrega. Costo despreciable para el estudiante.</text>
