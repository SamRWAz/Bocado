      <text x="0" y="98" font-family="Plus Jakarta Sans, Outfit, Inter, sans-serif" font-size="20" font-weight="400" fill="#59483E">Aprovechamiento de la alta densidad física de la Universidad Icesi con CAC cercano a cero.</text>
